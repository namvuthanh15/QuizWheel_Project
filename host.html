<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>QuizWheel – Host</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    body { padding-bottom: 40px; }
    main { max-width: 1100px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
    .tabs .btn { padding: 8px 18px; }
    .tabs .btn.active { background: var(--yellow); color: var(--ink); }
    .tbl-wrap { overflow-x: auto; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; background: #fff; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; }
    .tbl th, .tbl td { padding: 7px 10px; border-bottom: 1px solid #e7c98a; text-align: left; vertical-align: middle; }
    .tbl th { background: var(--card-2); white-space: nowrap; }
    .tbl .num { text-align: right; white-space: nowrap; }
    .tbl .off td { opacity: .55; }
    .acts { display: flex; flex-wrap: wrap; gap: 4px 10px; }
    /* --- Cột "Thao tác" gọn: 3 nút chính + menu "Thêm"; thẻ dọc trên điện thoại --- */
    .pname { font-weight: 800; } .sub { color: var(--muted); font-size: .76rem; font-weight: 600; margin-top: 2px; }
    .chip { display: inline-block; margin-left: 6px; padding: 0 8px; border: 2px solid var(--ink); border-radius: 999px; background: var(--yellow); color: var(--ink); font-size: .68rem; font-weight: 800; }
    .acts-main { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
    .mini-btn { font: inherit; font-weight: 800; font-size: .82rem; padding: 5px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--card-2); color: var(--text); cursor: pointer; box-shadow: 0 3px 0 #b9852d; white-space: nowrap; }
    .mini-btn.primary { background: linear-gradient(180deg, #ffe46b, #ffb92a); }
    .mini-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b9852d; }
    .mini-btn:focus-visible, .menu-item:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    .menu { position: relative; }
    .menu-pop { position: fixed; z-index: 60; min-width: 220px; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow: auto; padding: 8px; background: var(--card); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 6px 0 #a24a00, 0 14px 24px rgba(60,20,0,.35); }
    .menu-title { padding: 6px 10px 2px; font-size: .7rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .menu-sep { height: 1px; margin: 6px 4px; background: #e7c98a; }
    .menu-item { display: block; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; text-align: left; font: inherit; font-weight: 700; color: var(--text); cursor: pointer; }
    .menu-item:hover, .menu-item:focus-visible { background: var(--card-2); }
    .menu-item.danger { color: #b4120a; }
    @media (max-width: 760px) {
      .tbl-wrap { overflow: visible; }
      table.tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: auto; }
      table.tbl { border: 0; background: none; border-radius: 0; }
      .tbl tr.head-row { display: none; }
      .tbl tr.prow { margin-bottom: 12px; padding: 12px 14px; background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 #b9852d; }
      .tbl td { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 5px 0; border-bottom: 1px dashed #e7c98a; text-align: right; }
      .tbl td::before { content: attr(data-label); flex: none; font-size: .82rem; font-weight: 700; color: var(--muted); text-align: left; }
      .tbl td.cell-name { display: block; padding: 0 0 8px; margin-bottom: 4px; border-bottom: 2px solid var(--ink); text-align: left; }
      .tbl td.cell-name::before, .tbl td.cell-acts::before { content: none; }
      .tbl td.cell-acts { display: block; padding: 10px 0 0; border-bottom: 0; }
      .mini-btn { min-height: 38px; padding: 7px 14px; }
    }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 8px 0; }
    .row .field { margin: 0; min-width: 120px; flex: 1; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
    .dirty { display: inline-block; background: var(--yellow); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 12px; font-weight: 800; font-size: .85rem; }
    .ans-block { border: 2px solid var(--ink); border-radius: 12px; padding: 10px; background: #fff; display: grid; gap: 6px; }
    .ans-block img { max-width: 100%; max-height: 120px; object-fit: contain; border-radius: 8px; }
    .wrow[hidden] { display: none; }
    .wrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
    .wrow .w-label { flex: 1; min-width: 140px; }
    .ok-msg { color: #136b3a; font-weight: 800; }
    pre.preview { background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .lose-prev { max-width: 260px; border: 3px solid var(--ink); border-radius: 12px; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="host.html">QUIZ<span>WHEEL</span> · HOST</a>
    <div><button class="nav-link" type="button" id="btn-out" hidden>Thoát</button></div>
  </header>

  <main>
    <!-- Đăng nhập host -->
    <section id="sec-login" class="card" style="max-width:420px;margin:24px auto">
      <h2>Đăng nhập host</h2>
      <form id="login-form" autocomplete="off">
        <label class="field"><span>Mật khẩu host</span><input id="key" type="password" autocomplete="current-password"></label>
        <label class="wrow" id="trust-row" hidden><input type="checkbox" id="trust"><span>Lưu thiết bị này an toàn trong 7 ngày (vào web và tải lại trang không cần nhập lại mật khẩu)</span></label>
        <p class="feedback bad" id="login-err" role="alert"></p>
        <button class="btn btn-primary" id="login-go" type="submit">Vào</button>
      </form>
      <p class="note">Mật khẩu không bao giờ được lưu trong trình duyệt. Nếu bạn chọn “Lưu thiết bị”, trình duyệt chỉ giữ một mã thiết bị ngẫu nhiên có hạn 7 ngày; bấm Thoát hoặc tắt tính năng trong tab Cài đặt là mã mất hiệu lực.</p>
    </section>

    <!-- Giao diện host -->
    <section id="sec-app" hidden>
      <div class="tabs" role="tablist" id="tabs"></div>
      <p class="feedback" id="msg" role="status"></p>
      <div id="tab-players"></div>
      <div id="tab-questions" hidden></div>
      <div id="tab-wheels" hidden></div>
      <div id="tab-settings" hidden></div>
      <div id="tab-data" hidden></div>
    </section>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-text" hidden>
    <div class="card modal-box">
      <p id="modal-text"></p>
      <div class="form-actions">
        <button class="btn btn-primary" id="modal-ok" type="button">Đồng ý</button>
        <button class="btn btn-secondary" id="modal-cancel" type="button">Hủy</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/i18n.js"></script>
  <script src="data/seed.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/host-admin.js"></script>
</body>
</html>
